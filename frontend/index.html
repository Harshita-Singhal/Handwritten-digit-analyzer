<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Digit Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header>
            <h1>Digit Analyzer <span>AI</span></h1>
            <p>Draw a number from 0-9 below and let the neural network predict it.</p>
        </header>

        <div class="app-layout">
            <!-- Canvas Section -->
            <div class="canvas-panel">
                <canvas id="drawingCanvas" width="280" height="280"></canvas>
                <div class="controls">
                    <button id="clearBtn" class="btn secondary">Clear Canvas</button>
                    <button id="analyzeBtn" class="btn primary">Analyze Digit</button>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-panel">
                <h2>Prediction Result</h2>
                <div id="predictionDisplay" class="prediction-box">
                    <span class="placeholder">Awaiting input...</span>
                </div>
                <div class="confidence-bar-container">
                    <p>Confidence: <span id="confidenceText">0%</span></p>
                    <div class="confidence-track">
                        <div id="confidenceFill" class="confidence-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
